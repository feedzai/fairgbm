# This workflow builds the wheels and the source distribution, and uploads them to PyPI when a version tag is pushed.
# lib_lightgbm is compiled, so each wheel only works on the platform it was built for.

name: Upload Python Package

on:
  push:
    tags:
      - v*
  pull_request:
    paths:
      - .github/workflows/python_publish.yml
      - CMakeLists.txt
      - python-package/setup.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64, Linux aarch64 and macOS arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install OpenMP
      if: runner.os == 'macOS'
      run: brew install libomp
    - name: Build wheel
      uses: pypa/cibuildwheel@v4.3.5
      with:
        package-dir: python-package
      env:
        # The wheels are tagged py3-none-<platform>, so one build per platform is enough
        CIBW_BUILD: cp311-*
        CIBW_SKIP: "*-musllinux_*"
        # Like LightGBM, use Homebrew's libomp instead of copying it into the wheel, so that fairgbm and lightgbm
        # share one OpenMP runtime when they are used in the same process
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
        CIBW_TEST_REQUIRES: numpy<2
        CIBW_TEST_COMMAND: >-
          python -c "import numpy as np, fairgbm;
          rng = np.random.default_rng(0); X = rng.random((500, 4)); s = rng.integers(0, 2, 500);
          y = (X[:, 0] + 0.2 * s > 0.6).astype(int);
          params = {'objective': 'constrained_cross_entropy', 'constraint_type': 'FNR', 'verbose': -1};
          booster = fairgbm.train(params, fairgbm.Dataset(X, label=y, constraint_group=s), num_boost_round=5);
          assert booster.predict(X).shape == (500,)"
    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist python-package/
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: python-package/dist/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages_dir: dist
        verbose: true
