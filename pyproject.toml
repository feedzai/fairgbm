[build-system]
requires = ["setuptools>=64", "wheel", "cmake>=3.14"]
build-backend = "setuptools.build_meta"

[project]
name = "fairgbm"
dynamic = ["version"]
description = "Fairness-constrained Gradient Boosting — LightGBM with Lagrangian fairness constraints"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "lightgbm>=3.3.0,<5.0.0",
    "numpy",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.setuptools.dynamic]
version = {file = "VERSION.txt"}

[tool.setuptools.packages.find]
include = ["fairgbm*"]
